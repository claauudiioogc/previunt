; PREVIUNT · receptor de alerta con ESP32 + buzzer (PlatformIO en VS Code)
; Antes de compilar: copiar include/secretos.ejemplo.h como include/secretos.h y completarlo (no se sube a Git).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_src_flags = -Wall
